<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الطوابير - بنك الفلاحة والتنمية الريفية BADR</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #041710; color: #ffffff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; padding: 15px; }
        
        .header { background: linear-gradient(135deg, #004d2c, #001a0e); border: 3px solid #00c853; border-radius: 12px; padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0, 200, 83, 0.3); }
        .bank-brand { display: flex; align-items: center; gap: 15px; }
        .bank-logo { width: 55px; height: 55px; background: linear-gradient(135deg, #00c853, #ffd600); color: #001a0e; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 28px; font-weight: bold; box-shadow: 0 0 12px #ffd600; border: 2px solid #fff; }
        .office-name h2 { font-size: 22px; color: #fff; letter-spacing: 1px; }
        .office-name p { font-size: 13px; color: #b9f6ca; }
        .date-time { font-size: 16px; font-weight: bold; color: #ffd600; }

        .main-content { display: flex; flex: 1; gap: 15px; margin-bottom: 15px; }
        .current-call-section { flex: 2; display: flex; flex-direction: column; gap: 15px; }
        
        .display-card { flex: 1; background: linear-gradient(90deg, #00331b, #00140a); border: 4px solid #ffd600; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; padding: 0 40px; box-shadow: 0 6px 15px rgba(0,0,0,0.6); }
        .ar-label { font-size: 38px; font-weight: bold; color: #ffffff; }
        .fr-label { font-size: 24px; color: #ffd600; letter-spacing: 2px; }
        .number-display { font-size: 95px; font-weight: 900; color: #00e676; text-shadow: 0 0 20px rgba(0, 230, 118, 0.6); }

        .media-side-section { flex: 1; background: #ffffff; color: #001a0e; border-radius: 12px; border: 4px solid #004d2c; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 15px; }
        .announcement-box h3 { font-size: 24px; color: #004d2c; margin-bottom: 8px; font-weight: bold; }
        .announcement-box p { font-size: 16px; color: #00796b; margin-bottom: 20px; }
        .ticker-message { background: #ffd600; color: #001a0e; padding: 12px 15px; border-radius: 8px; font-size: 18px; font-weight: bold; width: 100%; box-shadow: 0 4px 10px rgba(255,214,0,0.3); }

        .footer { text-align: center; font-size: 13px; color: #aaa; border-top: 1px solid #113; padding-top: 8px; }
    </style>
</head>
<body>
    <div class="container" style="display:flex; flex-direction:column; height:100%;">
        <header class="header">
            <div class="bank-brand">
                <div class="bank-logo">🌾</div>
                <div class="office-name">
                    <h2>بنك الفلاحة والتنمية الريفية - سطيف</h2>
                    <p>BADR BANK - WILAYA DE SETIF</p>
                </div>
            </div>
            <div class="logo-area">
                <span class="date-time" id="datetime">25/04/2026 11:50</span>
            </div>
        </header>

        <div class="main-content">
            <div class="current-call-section">
                <div class="display-card ticket-card">
                    <div class="label-group">
                        <span class="ar-label">التذكرة</span>
                        <span class="fr-label">TICKET</span>
                    </div>
                    <div class="number-display" id="current-ticket">185</div>
                </div>

                <div class="display-card guichet-card">
                    <div class="label-group">
                        <span class="ar-label">الشباك</span>
                        <span class="fr-label">GUICHET</span>
                    </div>
                    <div class="number-display" id="current-guichet">2</div>
                </div>
            </div>

            <div class="media-side-section">
                <div class="announcement-box">
                    <h3>أهلاً بكم في بنك البدر</h3>
                    <p>Banque de l'Agriculture et du Développement Rural</p>
                    <div class="ticker-message">
                        <span>في خدمة الاقتصاد الوطني والفلّاحين</span>
                    </div>
                </div>
            </div>
        </div>

        <footer class="footer">
            <p>(C) BADR BANK SYSTEMS 2026 - فرع ولاية سطيف</p>
        </footer>
    </div>

    <script>
        function updateDateTime() {
            const now = new Date();
            const options = { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            document.getElementById('datetime').innerText = now.toLocaleString('en-GB', options);
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();
    </script>
</body>
</html>
